<!DOCTYPE html>
<html lang="en" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Coach – Capgemini Communication Prep</title>
<style>
:root{--bg:#fff;--ink:#000;--mut:#444;--acc:#0b5fff;--soft:#eef3ff;--line:#cfd4dc;--ok:#0a7a3d;--bad:#c0281a;--side:#f4f5f7}
[data-t=dark]{--bg:#000;--ink:#fff;--mut:#bbb;--acc:#6ea8ff;--soft:#0f1a2e;--line:#333;--ok:#4cd98a;--bad:#ff7b6b;--side:#0c0c0c}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:1.25rem;margin:4px 8px 14px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin:2px 0}
aside button.on{background:var(--acc);color:#fff}aside button small{display:block;opacity:.7;font-size:.78rem}
aside hr{border:0;border-top:1px solid var(--line);margin:10px 0}
main{padding:22px 28px 60px;width:100%;min-width:0}
h2{font-size:1.6rem;margin:0 0 8px}h3{margin:1.1em 0 .3em}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.b{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;margin:4px 6px 4px 0;text-decoration:none}
.b.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.b:disabled{opacity:.5}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border:2px solid var(--ok)}.opt.bad{border:2px solid var(--bad)}
.pas{background:var(--soft);border-left:4px solid var(--acc);padding:12px 16px;border-radius:6px;margin:10px 0}
textarea,input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:170px}.mut{color:var(--mut);font-size:.92rem}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.fb{white-space:pre-wrap;background:var(--soft);padding:14px;border-radius:8px;margin-top:10px}
ul{padding-left:22px}li{margin:4px 0}code{background:var(--soft);padding:1px 6px;border-radius:4px}
.tabs{margin:8px 0}.tip li::marker{content:"<i class="ic i-bulb"></i> "}
.m{padding:9px 13px;border-radius:10px;margin:6px 0;white-space:pre-wrap}.m.u{background:var(--soft)}.m.a{border:1px solid var(--line)}
.big{font-size:2rem;font-weight:700}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.4em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}
.i-cap{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M22 10 12 5 2 10l10 5 10-5z%27/%3E%3Cpath d=%27M6 12v5c3 2 9 2 12 0v-5%27/%3E%3C/svg%3E")}.i-home{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 11l9-8 9 8%27/%3E%3Cpath d=%27M5 10v10h14V10%27/%3E%3C/svg%3E")}.i-pen{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M12 20h9%27/%3E%3Cpath d=%27M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z%27/%3E%3C/svg%3E")}.i-mail{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Crect x=%272%27 y=%274%27 width=%2720%27 height=%2716%27 rx=%272%27/%3E%3Cpath d=%27M22 6l-10 7L2 6%27/%3E%3C/svg%3E")}.i-chat{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z%27/%3E%3C/svg%3E")}.i-book{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M2 4h7a3 3 0 013 3v14a2 2 0 00-2-2H2z%27/%3E%3Cpath d=%27M22 4h-7a3 3 0 00-3 3v14a2 2 0 012-2h8z%27/%3E%3C/svg%3E")}.i-head{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3 =%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z%27/%3E%3C/svg%3E")}.i-target{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%276%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%272%27/%3E%3C/svg%3E")}.i-lib{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z%27/%3E%3Cpath d=%27M4 19.5A2.5 2.5 0 006.5 22H20v-5%27/%3E%3C/svg%3E")}.i-zap{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M13 2L3 14h9l-1 8 10-12h-9z%27/%3E%3C/svg%3E")}.i-ok{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3Cpath d=%27M8 12l3 3 5-6%27/%3E%3C/svg%3E")}.i-no{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3Cpath d=%27M15 9l-6 6M9 9l6 6%27/%3E%3C/svg%3E")}.i-play{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3Cpath d=%27M10 8l6 4-6 4z%27/%3E%3C/svg%3E")}.i-bulb{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z%27/%3E%3C/svg%3E")}.i-clock{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3Cpath d=%27M12 6v6l4 2%27/%3E%3C/svg%3E")}.i-rec{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%278%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%273%27/%3E%3C/svg%3E")}.i-stop{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Crect x=%276%27 y=%276%27 width=%2712%27 height=%2712%27 rx=%271%27/%3E%3C/svg%3E")}.i-vol{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M11 5L6 9H2v6h4l5 4z%27/%3E%3Cpath d=%27M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14%27/%3E%3C/svg%3E")}.i-file{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z%27/%3E%3Cpath d=%27M14 2v6h6M8 13h8M8 17h8%27/%3E%3C/svg%3E")}.i-arr{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M5 12h14M13 6l6 6-6 6%27/%3E%3C/svg%3E")}.i-menu{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 6h18M3 12h18M3 18h18%27/%3E%3C/svg%3E")}
.tip li{position:relative;padding-left:1.9em}.tip li .ic{position:absolute;left:0;top:.28em;color:var(--acc)}
.top,.scrim{display:none}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;font-size:clamp(15px,.9rem + .25vw,17px)}
main{padding:clamp(14px,3vw,32px) clamp(14px,3.2vw,36px) 60px;padding-bottom:max(60px,env(safe-area-inset-bottom))}
h2{font-size:clamp(1.3rem,1.1rem + 1vw,1.9rem)}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.b,.opt,aside button{min-height:44px}.b{display:inline-flex;align-items:center;justify-content:center}
.opt{overflow-wrap:anywhere}.pas,.fb,.card{overflow-wrap:anywhere}
@media(max-width:1100px){.wrap{grid-template-columns:230px 1fr}}
@media(max-width:820px){
.wrap{grid-template-columns:1fr}
.top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--side);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.top button{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;display:grid;place-items:center}
aside{position:fixed;left:0;top:0;bottom:0;z-index:40;width:min(300px,86vw);height:100dvh;transform:translateX(-102%);transition:transform .22s;border-right:1px solid var(--line);padding-top:max(16px,env(safe-area-inset-top))}
body.nav aside{transform:none}
body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
body.nav{overflow:hidden}}
@media(max-width:520px){.card{padding:14px}.b{width:100%;margin-right:0}.tabs .b{width:calc(50% - 4px);margin-right:4px}.big{font-size:1.6rem}textarea{min-height:140px}}
@media(min-width:1600px){body{font-size:18px}.wrap{grid-template-columns:300px 1fr}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
.i-send{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M22 2L11 13M22 2l-7 20-4-9-9-4z%27/%3E%3C/svg%3E")}.i-x{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M18 6L6 18M6 6l12 12%27/%3E%3C/svg%3E")}.i-trash{--m:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14%27/%3E%3C/svg%3E")}
.vid{margin:4px 0 12px}.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:520px}th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{background:var(--soft)}
h4{margin:1em 0 .2em}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.35)}
[data-t=dark] .fab{color:#000}

/* ===== Chatbot v8: neat UI, typing animation, scrollbars ===== */
.sb,#bm,.chat,.cbox textarea{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 28%,transparent) transparent}
.sb::-webkit-scrollbar,#bm::-webkit-scrollbar,.chat::-webkit-scrollbar,.cbox textarea::-webkit-scrollbar{width:10px;height:10px}
.sb::-webkit-scrollbar-track,#bm::-webkit-scrollbar-track,.chat::-webkit-scrollbar-track,.cbox textarea::-webkit-scrollbar-track{background:transparent}
.sb::-webkit-scrollbar-thumb,#bm::-webkit-scrollbar-thumb,.chat::-webkit-scrollbar-thumb,.cbox textarea::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 24%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.sb::-webkit-scrollbar-thumb:hover,#bm::-webkit-scrollbar-thumb:hover,.chat::-webkit-scrollbar-thumb:hover,.cbox textarea::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--ink) 45%,transparent);background-clip:content-box}
.bot{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:min(410px,calc(100vw - 24px));height:min(620px,calc(100dvh - 32px));background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;z-index:70;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.32);overflow:hidden;animation:pop .22s ease-out;transform-origin:100% 100%}
.bot[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.bh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--side);flex:none}
.bt{flex:1;min-width:0;line-height:1.25}.bt b{display:block;font-size:.98rem}
.bt small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.bh button{width:36px;height:36px;min-height:36px;border:0;background:transparent;color:var(--mut);border-radius:9px;cursor:pointer;display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.bh button:hover{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.av.lg{width:38px;height:38px}
[data-t=dark] .av{color:#000}
#bm{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 10px 6px 14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.row{display:flex;align-items:flex-end;gap:8px;margin:0 0 12px}
.row.u{justify-content:flex-end}
.row.in{animation:rin .22s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(8px)}}
.bm{padding:9px 13px;border-radius:16px;max-width:calc(100% - 40px);font-size:.95rem;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.row.u .bm{max-width:86%}
.bm.u{background:var(--acc);color:#fff;border-bottom-right-radius:5px}
[data-t=dark] .bm.u{color:#000}
.bm.a{background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px}
.bm code{font-size:.9em}
.caret::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;background:var(--acc);vertical-align:-.18em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 2px}

grammar:{body:`<h3>What the grammar section tests</h3>
<p>10 questions. They test sentence structure, error spotting and correction, more than drag-and-drop ordering.</p>
<ul><li><b>Subject-verb agreement:</b> <code>Neither the team members nor the manager <b>is</b> attending the meeting.</code></li>
<li><b>Sentence correction and error spotting:</b> pick the flawless version of a sentence, or the correct underlined part.</li>
<li><b>Tenses and prepositions:</b> fix a wrong time frame or preposition, for example <code>discussing about</code> becomes <code>discussing</code>.</li>
<li><b>Articles and voice:</b> place a, an, the correctly, or convert active to passive.</li>
<li><b>Sentence rearrangement (jumbled sentences):</b> appears in the 30-question MCQ format of some drives. The layout depends on your drive.</li></ul>
<h3>Tenses</h3>${VB('12 Tenses','12 tenses in english grammar')}
<div class="tw"><table><tr><th>Tense</th><th>Use</th><th>Examples</th></tr>
<tr><td>Simple present</td><td>habits, facts</td><td>She works in Chennai. The sun rises in the east.</td></tr>
<tr><td>Present continuous</td><td>happening now, temporary</td><td>I am studying now. He is working from home this week.</td></tr>
<tr><td>Present perfect</td><td>past action, present result</td><td>I have finished the report. She has lived here for five years.</td></tr>
<tr><td>Present perfect continuous</td><td>started in the past, still going</td><td>I have been waiting for two hours.</td></tr>
<tr><td>Simple past</td><td>finished action</td><td>He joined the company in 2024.</td></tr>
<tr><td>Past continuous</td><td>in progress at a past time</td><td>I was cooking when she called.</td></tr>
<tr><td>Past perfect</td><td>earlier of two past actions</td><td>The train had left before we reached the station.</td></tr>
<tr><td>Past perfect continuous</td><td>long action before a past point</td><td>She had been working for hours before the power went off.</td></tr>
<tr><td>Simple future</td><td>decision or prediction</td><td>I will call you tomorrow.</td></tr>
<tr><td>Future continuous</td><td>in progress at a future time</td><td>This time tomorrow, I will be travelling.</td></tr>
<tr><td>Future perfect</td><td>completed before a future time</td><td>By 5 pm, I will have completed the task.</td></tr>
<tr><td>Future perfect continuous</td><td>duration up to a future time</td><td>By June, he will have been working here for three years.</td></tr></table></div>
<h4>Time clue words</h4><ul><li>every day, usually, always = simple present</li><li>now, at the moment, currently = present continuous</li><li>already, yet, just, ever, since, for = present perfect</li><li>yesterday, last year, ago, in 2020 = simple past</li><li>by the time, before, after (two past actions) = past perfect</li><li>tomorrow, next week, soon = future</li></ul>
<h3>Common sentence-correction errors</h3>${VB('Sentence correction','sentence correction error spotting english grammar')}
<ul><li><b>Wrong:</b> She don't like coffee. <b>Right:</b> She doesn't like coffee.</li><li><b>Wrong:</b> He go to office yesterday. <b>Right:</b> He went to the office yesterday.</li><li><b>Wrong:</b> I am knowing him. <b>Right:</b> I know him. (state verbs like know, like, want are not used in continuous)</li><li><b>Wrong:</b> I have seen him yesterday. <b>Right:</b> I saw him yesterday. (a finished time word needs simple past)</li><li><b>Wrong:</b> She is living here since 2020. <b>Right:</b> She has been living here since 2020.</li><li><b>Wrong:</b> He said me the truth. <b>Right:</b> He told me the truth. / He said the truth to me.</li><li><b>Wrong:</b> The informations are useful. <b>Right:</b> The information is useful.</li><li><b>Wrong:</b> I discussed about the plan. <b>Right:</b> I discussed the plan.</li></ul>
<h3>Subject-verb agreement</h3>${VB('Subject-verb agreement','subject verb agreement')}
<ul><li>Find the real subject: <code>The list of items <b>is</b> ready.</code> <code>The price of the tickets <b>has</b> increased.</code></li><li>Singular words: each, every, either, neither, everyone, someone, news, mathematics. <code>Everyone <b>is</b> present.</code> <code>Neither of them <b>was</b> late.</code></li><li>"Along with, as well as, together with" do not change the verb: <code>The manager, along with his team, <b>is</b> attending.</code></li><li>Two subjects joined by "and" take a plural verb: <code>Ravi and Meera <b>are</b> friends.</code></li><li>With "or / nor", the verb agrees with the nearer subject: <code>Neither the boss nor the employees <b>were</b> present.</code></li></ul>
<h3>Articles: a, an, the</h3>${VB('Articles','articles a an the english grammar')}
<ul><li>a/an by sound: <code>an hour</code>, <code>an MBA</code>, <code>a university</code>, <code>a European trip</code>.</li><li>First mention = a/an, second mention = the: <code>I bought a laptop. The laptop is fast.</code></li><li>Unique things take the: <code>the sun</code>, <code>the Internet</code>, <code>the Prime Minister</code>.</li><li>No article: general plurals and uncountables (<code>Information is power</code>), languages, meals (<code>I had lunch</code>), most names.</li></ul>
<h3>Prepositions</h3>${VB('Prepositions','prepositions in english grammar')}
<ul><li>Time: at 5 pm, at night; on Monday, on 5 May; in May, in 2026, in the morning.</li><li>Place: at the station, in Chennai, on the table.</li><li>Fixed pairs: good <b>at</b>, interested <b>in</b>, depend <b>on</b>, senior/junior <b>to</b>, different <b>from</b>, responsible <b>for</b>, apologise <b>for</b>, afraid <b>of</b>, married <b>to</b>, wait <b>for</b>, listen <b>to</b>, agree <b>with</b> a person, agree <b>to</b> a plan.</li><li>By = deadline, doer or vehicle: <code>Submit it by Friday.</code> <code>Written by Ravi.</code> <code>By bus.</code></li></ul>
<h3>Conditionals</h3>${VB('Conditionals','conditional sentences english grammar')}
<ul><li>Zero (facts): <code>If you heat ice, it melts.</code></li><li>First (real future): <code>If it rains, we will stay home.</code></li><li>Second (unreal present): <code>If I were you, I would call him.</code></li><li>Third (unreal past): <code>If I had known, I would have called.</code></li></ul>
<h3>Passive voice</h3>${VB('Passive voice','active and passive voice english grammar')}
<ul><li>Present: <code>The report is written every week.</code></li><li>Past: <code>The report was reviewed yesterday.</code></li><li>Future: <code>The report will be sent tomorrow.</code></li><li>Perfect: <code>The work has been completed.</code></li><li>Active to passive: <code>Ravi wrote the email.</code> becomes <code>The email was written by Ravi.</code></li></ul>
<h3>Reported speech</h3>${VB('Reported speech','reported speech direct indirect')}
<ul><li><code>"I am busy."</code> becomes <code>He said he was busy.</code></li><li><code>"I will call you."</code> becomes <code>She said she would call me.</code></li><li><code>"I have finished."</code> becomes <code>He said he had finished.</code></li><li>Questions: <code>"Are you ready?"</code> becomes <code>She asked if I was ready.</code> (no question order)</li><li>Time words change: today becomes that day, tomorrow becomes the next day, here becomes there.</li></ul>
<h3>Sentence rearrangement (jumbled sentences)</h3>${VB('Sentence rearrangement','sentence rearrangement jumbled sentences')}
<p class="mut">Common in the 30-question MCQ format. In the 6-section round, grammar leans more to correction than ordering.</p>
<ul><li><b>Find the opener:</b> it introduces the topic. It has no <i>this, he, however, as a result</i>.</li>
<li><b>Follow the links:</b> a pronoun (he, it, this) comes after the noun it points to. A linker (however, therefore, as a result, finally) comes after the idea it connects.</li>
<li><b>Find the closer:</b> conclusions, thanks and final results come last.</li>
<li><b>Use the options:</b> compare the first letters and pairs to cut wrong choices fast.</li></ul>
<div class="pas"><b>Words:</b> (P) submitted (Q) the report (R) before the deadline (S) she<br><b>Order:</b> S P Q R. <i>She submitted the report before the deadline.</i> Subject, verb, object, extra detail.</div>
<div class="pas"><b>Sentences:</b> P. However, an error occurred. Q. The upgrade began at midnight. R. As a result, the site was down.<br><b>Order:</b> Q P R. Q opens, \"However\" follows the first event, \"As a result\" follows the error.</div>`,
tips:['Read the whole sentence first, then name the grammar point being tested (tense, agreement, article, preposition).','Time words decide tense: yesterday, ago = past; since, for, already, yet = present perfect; by the time = past perfect; tomorrow = future.','Neither, either, each, every, one of, everyone, news = SINGULAR verb.','Ignore the phrase between commas when checking agreement: "The boss, with his staff, IS...".','Learn prepositions as fixed pairs (good at, senior to). Do not translate from Tamil.','Countable = fewer / many. Uncountable = less / much.','After "suggest, avoid, enjoy, finish, mind" use verb + ing: "suggested moving".','Hardly...when, No sooner...than, Not only...but also: learn these pairs.','Keep lists parallel: reading, writing and travelling (all -ing).','Two options look identical? Compare only the part that differs. Cut two wrong answers fast, then decide.','No time for a perfect answer: choose the option that sounds formal and simple.'],

business:{body:`<h3>What you do in this section</h3>
<p>2 writing tasks, a short essay or email draft. You type an official email from a prompt, for example asking your manager for emergency leave, or explaining a project bug to a client.</p>
<h3>Email structure</h3>${VB('Email writing format','professional email writing in english')}
<ul><li><b>Subject:</b> specific and short.</li><li><b>Greeting:</b> Dear Mr Rao, / Hi Priya,</li><li><b>Purpose in line 1</b>, then details, then the action or deadline.</li><li><b>Closing:</b> Thank you, then Regards and your name.</li></ul>
<div class="pas"><b>Sample: leave request</b><br>Subject: Request for leave: 3-5 October<br><br>Dear Mr Rao,<br>I am writing to request leave from 3 to 5 October to attend a family function. I have completed my pending tasks, and my colleague Anita has agreed to handle urgent queries in my absence. Please let me know if you need any further information.<br>Thank you for your consideration.<br>Regards,<br>Hemkumar</div>
<h3>Chat and message style</h3>${VB('Workplace chat messages','professional workplace chat message english')}
<ul><li><b>Good:</b> Hi Anita, could you share the updated file by 4 pm? Thanks!</li><li><b>Weak:</b> send file now</li><li><b>Good reply when late:</b> Hi Ravi, sorry for the delay. I will send the report by tomorrow 10 am. Is that fine?</li><li><b>Weak:</b> will do later</li><li>One request per message, and always give the time or deadline.</li></ul>
<h3>Useful phrases</h3>${VB('Business English phrases','business english email phrases')}
<ul><li>Requesting: <code>Could you please share...</code> <code>Kindly let me know...</code></li><li>Apologising: <code>Apologies for the delay; the report is attached.</code></li><li>Declining: <code>Unfortunately, I am unable to attend. However, I can join on Monday.</code></li><li>Following up: <code>I am following up on my earlier email regarding...</code></li><li>Confirming: <code>I confirm my attendance for Friday at 3 pm.</code></li><li>Attaching: <code>Please find the report attached.</code></li></ul>
<h3>The 2 writing tasks in the exam</h3>
<ul><li>Expect one email and one message or reply. Write 80 to 150 words.</li><li>Cover every point in the task. Tick each one off.</li><li>Finish politely and re-read once for spelling and tense.</li></ul>`,
tips:['Use this skeleton every time: Subject, Greeting, Purpose, Details, Action/Deadline, Thanks, Name.','Cover EVERY point in the task. Tick each requirement before you submit.','Start with the purpose in the first sentence. Do not write long introductions.','Use "Could you please..." instead of commands. Use "Apologies for..." for mistakes.','Never use slang, emojis, ALL CAPS or "urgent!!!" in formal writing.','Keep sentences under 20 words. Short and correct beats long and risky.','Offer a solution or next step in every apology or refusal.','Reread once for spelling, tense and missing articles.','Match tone to the reader: manager or client = formal; teammate chat = friendly but professional.'],

situation:{body:`<h3>What you do in this section</h3>
<p>6 questions, multiple choice or chat simulation. You read an office scenario, for example a colleague misses a deadline, and select the most appropriate professional response.</p>
<h3>The winning pattern</h3>${VB('Workplace communication','workplace communication skills english')}
<ul><li>Acknowledge the problem, take ownership, give a next step, stay respectful.</li><li>Choose calm, professional, solution-focused replies.</li></ul>
<h3>Worked examples</h3>${VB('Situational judgement basics','situational judgement test tips')}
<div class="pas"><b>1. Your teammate will miss a deadline.</b><br>Best: Ask if they need help and tell the manager early if the deadline is at risk. Why: supportive, transparent, early.</div>
<div class="pas"><b>2. A client is angry about a delay.</b><br>Best: "I understand your concern and apologise. The new delivery date is Friday." Why: acknowledges, apologises, gives a plan.</div>
<div class="pas"><b>3. Your manager asks for a status update and you are behind.</b><br>Best: "I am two days behind because of X. I plan to finish by Friday. Could I get help with Y?" Why: honest, with a plan and a request.</div>
<h3>Avoid</h3><ul><li>Blaming others, ignoring the issue, arguing, rude or emotional replies.</li><li>Promising what you cannot deliver, hiding mistakes, doing nothing.</li></ul>
<h3>Chat and email reply templates</h3>${VB('Replying to complaints','reply to customer complaint email english')}
<ul><li>Cannot help: <code>Sorry, I can't tomorrow due to a prior commitment. Shall I help find someone else?</code></li><li>Customer unhappy: <code>I understand your frustration. Here is what I can do...</code></li><li>Need more time: <code>I need until Thursday to finish this properly. I will update you tomorrow.</code></li><li>Disagreement: <code>Thanks for your view. Could we look at the data together?</code></li></ul>`,
tips:['The best answer usually has three parts: acknowledge, apologise or explain, next step.','Eliminate answers that blame, ignore, argue, or hide the problem.','Eliminate extreme answers ("do it secretly", "refuse completely").','Prefer early communication over silence.','Prefer answers that involve the right person (manager, client) at the right time.','Tone check: would you be comfortable if your manager read this reply? If yes, it is probably correct.','For free-text replies: 3 to 5 sentences, polite, with one clear action.'],

reading:{body:`<h3>What you do in this section</h3>
<p>4 multiple-choice questions. You read a short paragraph about corporate tech, server upgrades or team dynamics, then answer direct and inference questions.</p>
<h3>Method</h3>${VB('Reading comprehension tricks','reading comprehension tricks')}
<ul><li>Read the questions first, then the passage once at normal speed.</li><li>Mark the main idea: usually the first and last sentence of each paragraph.</li><li>Answer only from the text, never from your own opinion.</li></ul>
<h3>Question types with examples</h3>${VB('Inference questions','inference questions reading comprehension')}
<div class="pas"><b>Passage:</b> Many firms now offer hybrid work. Employees save commuting time, but some feel isolated.</div>
<ul><li><b>Main idea:</b> "Hybrid work has benefits and drawbacks." (covers the whole passage)</li><li><b>Detail:</b> "What is one drawback?" Answer: some feel isolated. (stated directly)</li><li><b>Inference:</b> "Firms use hybrid work to balance time savings and connection." (a small logical step from the text)</li><li><b>Vocabulary:</b> "hybrid" means a mix. Put each option into the sentence and test it.</li></ul>
<h3>Trap options</h3>${VB('Vocabulary in context','vocabulary in context english')}
<ul><li>Extreme words: always, never, only, all, completely.</li><li>True in real life but not in the passage.</li><li>Details that answer a different question.</li></ul>`,
tips:['Read the 4 questions BEFORE the passage so you know what to look for.','Wrong options often use extreme words: always, never, only, all, completely.','Wrong options may be true in real life but not in the passage. Choose what the passage says.','For main idea, pick the option that covers the beginning, middle and end.','Inference = a small step from the text, not a big guess.','For vocabulary, read one sentence before and after the word.','Do not spend more than 2 minutes per passage question set.'],
vids:[['Reading comprehension tricks','reading comprehension tricks english tamil'],['Inference questions','inference questions reading comprehension tamil'],['Vocabulary in context','vocabulary in context english tamil']]},
listening:{body:`<h3>What you do in this section</h3>
<p>4 audio-based multiple-choice questions. A clip plays, for example a voicemail from a manager explaining server downtime. You listen and answer questions about the specific details.</p>
<h3>Method</h3>${VB('Improve listening skills','improve english listening skills')}
<ul><li>Read the questions and options before the audio starts.</li><li>Listen for the gist first, then numbers, names, dates, places.</li><li>Notice corrections and changes: <code>not Monday, Tuesday</code>, <code>moved to Wednesday</code>.</li><li>The audio may play only once. If you miss a word, move on.</li></ul>
<h3>Worked example</h3>${VB('Understand fast English','understand fast english speakers')}
<div class="pas"><b>Audio:</b> "The meeting has moved from Tuesday at 10 to Wednesday at 2, in Room B. Send questions to Meera by Monday."<br><b>Notes to write:</b> Wed 2 pm, Room B, Meera, Mon.<br><b>Q:</b> Where is the meeting? <b>A:</b> Room B.</div>
<h3>Quick note-taking shortcuts</h3><ul><li>Use symbols and short words: Wed 2p, Rm B, Mon, 4 hrs.</li><li>Write only numbers, names, places and reasons.</li></ul>
<h3>Daily habit</h3>${VB('Listening practice','english listening practice')}
<ul><li>Listen to 10 minutes of clear English. Pause, write one sentence (dictation), then check it.</li><li>After each practice, read the transcript and note words you missed.</li></ul>`,
tips:['Read the options first and predict what kind of answer you need (number, place, reason).','Write short notes while listening: times, names, numbers.','Change words signal the answer: "instead of", "moved to", "not... but".','Do not try to catch every word. Catch the meaning.','Headphones on, volume tested, room quiet. Sound problems lose easy marks.','After each practice, read the transcript and note words you missed.'],
vids:[['Improve English listening','improve english listening skills tamil'],['Understand fast English','understand fast english speakers tamil'],['Listening practice with explanation','english listening practice tamil']]},
speaking:{body:`<h3>What you do in this section</h3>
<p>2 voice-recording prompts. The screen shows a prompt such as \"Describe a time you solved a conflict.\" You get a brief window to think, then you speak clearly into your mic.</p>
<h3>The simulation</h3>${VB('Spoken English practice','spoken english practice')}
<ul><li>2 prompts. The maximum recording time is shown before each question.</li><li>You may submit a shorter answer, but you must speak <b>at least 100 words</b> to be evaluated.</li></ul>
<h3>Structure that fills 100+ words</h3>${VB('Speak English fluently','how to speak english fluently')}
<ul><li><b>Opening:</b> answer directly in one sentence.</li><li><b>Point 1</b> with reason and example (2 to 3 sentences).</li><li><b>Point 2</b> with reason and example (2 to 3 sentences).</li><li><b>Closing:</b> one summary sentence.</li></ul>
<div class="pas"><b>Sample (about 120 words):</b> "Do you prefer working alone or in a team?"<br>I prefer working in a team. Teamwork helps me learn faster and deliver better results. For example, in my final year project, four of us built a web app. One friend handled the design, another handled the database, and I wrote the backend. When I got stuck on an error, my teammate suggested a simple fix within minutes. Another reason is motivation. When everyone shares the workload, we meet deadlines with less stress. Of course, I also enjoy working alone when a task needs deep focus, but overall, teamwork gives better ideas and faster progress. That is why I choose to work in a team whenever possible.</div>
<h3>Phrases to keep talking</h3><ul><li><code>Let me give an example.</code> <code>Another reason is...</code> <code>In my experience...</code> <code>To sum up...</code></li></ul>
<h3>Pronunciation tips for Tamil speakers</h3>${VB('English pronunciation','english pronunciation')}
<ul><li>V and W: <code>very</code> (teeth on lip) vs <code>west</code> (rounded lips).</li><li>Word endings: pronounce the final sounds, like <code>worked</code>, <code>asked</code>, <code>reports</code>.</li><li>Stress the right syllable: <code>PHOtograph</code>, <code>phoTOgrapher</code>.</li><li>Speak steadily and pause at commas. Clear beats fast.</li></ul>
${VB('Tell me about yourself','tell me about yourself interview')}`,
tips:['Aim for 120 to 150 words so you safely pass 100.','Use Point, Reason, Example. It keeps you talking without panic.','Never stay silent. If stuck, use: "Let me give an example...", "Another reason is...".','Speak slowly and clearly. Accuracy matters more than speed.','Use simple sentences you can say correctly.','Avoid "umm". Take a short silent pause instead.','Keep the mic close and speak toward it. Stay in a quiet room.','Practise a 60-second "Tell me about yourself" until it feels automatic.','Do not end early. Use the time to add one more example.'],
vids:[['Spoken English practice','spoken english practice tamil'],['Speak English fluently for 2 minutes','how to speak english fluently tamil'],['English pronunciation','english pronunciation tamil'],['Tell me about yourself','tell me about yourself interview tamil']]}};

async function nextSet(k,n){

function mockPage(){M.active?mockRun():M.done?mockResult():mockIntro()}
function mockIntro(){pxLeave();M.done=false;const H=st.mocks||[];
 $('#app').innerHTML=`<h2><i class="ic i-clock"></i> Mock assessment</h2><p class="mut">A full-length practice test that follows the real exam format.</p>
 <div class="card"><h3>Test format</h3><div class="tw"><table><tr><th>Section</th><th>Questions</th></tr>${SECS.map(x=>`<tr><td>${x.e} ${x.n}</td><td>${x.c}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>28 questions · 60 minutes</b></td></tr></table></div>
 <h3>Before you start</h3><ul><li>This is a <b>proctored test</b>: camera, microphone and full screen are required. You will do a system check first.</li><li>The 60-minute timer starts when you press Begin. You cannot open other pages during the test.</li><li>Answers are saved automatically. You can move between questions using the number grid.</li><li>Listening audio plays <b>once</b> per passage. Put on headphones first.</li><li>Writing tasks: 80 to 150 words. Speaking: at least 100 words each, by mic (Chrome or Edge) or by typing.</li><li>24 questions are marked instantly. Writing and speaking can be reviewed with AI after the test.</li></ul>
 <button class="b" onclick="mockSetup()"><i class="ic i-play"></i> Start mock test</button></div>
 ${H.length?`<div class="card"><h3>Previous attempts</h3>${H.slice().reverse().slice(0,5).map(h=>`<div class="mrow"><span>${new Date(h.t).toLocaleDateString(undefined,{day:'numeric',month:'short'})}${h.flag?` <em class="pxtag">${h.term?'Terminated':'Flagged: '+h.flag}</em>`:''}</span><div class="bar"><i style="width:${Math.round(100*h.got/h.tot)}%"></i></div><b>${h.got}/${h.tot}</b></div>`).join('')}</div>`:''}`}
function mockStart(){clearInterval(M.tm);apReset();M={active:true,done:false,items:mockBuild(),i:0,ans:{},end:Date.now()+3600000,tm:null,rec:null,recOn:false,px:true,vl:[],term:false,pt:{},lv:{}};M.tm=setInterval(mockTick,500);pxArm();mockRun();scrollTo(0,0)}
function mockTick(){if(!M.active)return;const s=mockLeft(),t=$('#mt');if(t){t.textContent=apFmt(s);t.parentElement.classList.toggle('low',s<300)}if(s<=0)mockSubmit(true)}
function mockGo(i){mStopRec();M.i=Math.max(0,Math.min(M.items.length-1,i));mockRun();scrollTo({top:0})}
function mockRun(){mStopRec();const n=M.items.length,it=M.items[M.i],s=SN(it.k),last=M.i===n-1;
 let h=`<p class="mut">${s.e} ${s.n} · Question ${M.i+1} of ${n}</p>`;
 if(it.type==='mcq'){h+=(it.k==='listening'?apHTML():it.p?`<div class="pas">${esc(it.p)}</div>`:'')+`<h3>${esc(it.q)}</h3>`+it.ord.map((j,x)=>`<button class="opt ${M.ans[M.i]===j?'sel':''}" onclick="mockPick(${j})">${'ABCD'[x]}. ${esc(it.o[j])}</button>`).join('')}
 else if(it.type==='write')h+=`<h3>Writing task: ${it.kind}</h3><div class="pas">${esc(it.task)}</div><textarea id="mta" placeholder="Write your ${it.kind.toLowerCase()} here (80 to 150 words)…" oninput="mockType(this)">${esc(M.ans[M.i]||'')}</textarea><p class="mut"><b id="mwc">0</b> words · aim for 80 to 150</p>`;
 else h+=`<h3>Spoken response</h3><div class="pas">${esc(it.prompt)}</div><textarea id="mta" spellcheck="false" autocomplete="off" autocorrect="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" placeholder="Use the mic, or type what you would say…" oninput="mockType(this)">${esc(M.ans[M.i]||'')}</textarea><div class="mbar2"><button class="b g" id="mrb" onclick="mRec()"><i class="ic i-mic"></i>Record</button><span class="mut"><b id="mwc">0</b> / 100 words minimum</span></div><div class="bar"><i id="mwb" style="width:0"></i></div><p class="mut" id="mmsg"></p>`;
 h+=`<div class="mnav"><button class="b g" ${M.i?'':'disabled'} onclick="mockGo(M.i-1)">Previous</button><button class="b" onclick="${last?'mockAsk()':'mockGo(M.i+1)'}">${last?'Review &amp; submit':'Next'}</button></div>`;
 $('#app').innerHTML=`<div class="mbar"><div class="mtim ${mockLeft()<300?'low':''}"><i class="ic i-clock" style="margin:0"></i><b id="mt">${apFmt(mockLeft())}</b></div><div class="mprog"><span>Question ${M.i+1} of ${n}</span><div class="bar"><i style="width:${(M.i+1)/n*100}%"></i></div></div><button class="b g" onclick="mockAsk()">Finish</button></div>

 if(it.k==='listening')apInit(it.p);if(it.type!=='mcq')mockCount()}
